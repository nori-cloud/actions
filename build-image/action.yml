name: Build & Push Image
description: Build an app image and optionally publish commit-SHA tags to GHCR

inputs:
  app:
    description: App name used for the GHCR image and default Dockerfile path
    required: true
  dockerfile:
    description: Dockerfile path (defaults to apps/<app>/Dockerfile)
    required: false
    default: ''
  push:
    description: Whether to publish the image to GHCR
    required: false
    default: 'false'
  token:
    description: GitHub token with packages write permission (required when push is true)
    required: false

runs:
  using: composite
  steps:
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to GHCR
      if: inputs.push == 'true'
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ inputs.token }}

    - name: Generate image tags
      uses: docker/metadata-action@v5
      id: meta
      with:
        images: ghcr.io/${{ github.repository_owner }}/${{ inputs.app }}
        tags: |
          type=sha,format=long,prefix=
          type=sha,format=short,prefix=

    - name: Build and optionally push image
      uses: docker/build-push-action@v6
      with:
        context: .
        file: ${{ inputs.dockerfile || format('apps/{0}/Dockerfile', inputs.app) }}
        push: ${{ inputs.push == 'true' }}
        tags: ${{ steps.meta.outputs.tags }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
