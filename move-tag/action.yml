name: Move Tag
description: Force-moves a git tag and creates a chrono tag

inputs:
  tag:
    description: Tag name (e.g. outpost-dev, outpost-prod)
    required: true
  sha:
    description: Destination commit SHA
    required: true
  description:
    description: Optional annotation message
    required: false
    default: ''
  dry-run:
    description: Show what would happen without pushing
    required: false
    default: 'false'

outputs:
  chrono-tag:
    description: The chrono tag that was created
    value: ${{ steps.move.outputs.chrono-tag }}

runs:
  using: composite
  steps:
    - name: Move tag
      id: move
      shell: bash
      env:
        TAG: ${{ inputs.tag }}
        SHA: ${{ inputs.sha }}
        DESCRIPTION: ${{ inputs.description }}
        DRY_RUN: ${{ inputs.dry-run }}
      run: |
        TIMESTAMP=$(date +%Y%m%d%H%M%S)
        CHRONO_TAG="${TAG}-${TIMESTAMP}"
        SHORT="${SHA:0:7}"

        if [ "${DRY_RUN}" = "true" ]; then
          echo "::group::DRY-RUN: move ${TAG} → ${SHORT}"
          echo "  ${TAG} → ${SHORT}"
          echo "  ${CHRONO_TAG} → ${SHORT}"
          if [ -n "${DESCRIPTION}" ]; then
            echo "  description: ${DESCRIPTION}"
          fi
          echo "::endgroup::"
          echo "chrono-tag=${CHRONO_TAG}" >> "${GITHUB_OUTPUT}"
          exit 0
        fi

        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"

        if [ -n "${DESCRIPTION}" ]; then
          git tag -f -m "${DESCRIPTION}" "${TAG}" "${SHA}"
          git tag -m "${DESCRIPTION}" "${CHRONO_TAG}" "${SHA}"
        else
          git tag -f "${TAG}" "${SHA}"
          git tag "${CHRONO_TAG}" "${SHA}"
        fi
        git push -f origin "${TAG}" "${CHRONO_TAG}"
        echo "chrono-tag=${CHRONO_TAG}" >> "${GITHUB_OUTPUT}"
        echo "Moved ${TAG} → ${SHORT} (+ ${CHRONO_TAG})"
