name: GitOps Update Overlay
description: Update a kustomization overlay newTag in nori-cloud/apps

inputs:
  app:
    description: App name
    required: true
  tag:
    description: Image tag to set
    required: true
  overlay:
    description: Target overlay (dev | prod)
    required: true
  app-id:
    description: GitHub App ID for cross-repo access
    required: true
  private-key:
    description: GitHub App private key for cross-repo access
    required: true
  deploy-repo:
    description: GitOps repo
    required: false
    default: 'nori-cloud/apps'
  dry-run:
    description: Show diff without committing
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Generate GitHub App token
      uses: actions/create-github-app-token@v1
      id: app-token
      with:
        app-id: ${{ inputs.app-id }}
        private-key: ${{ inputs.private-key }}
        owner: nori-cloud
        repositories: apps

    - name: Update overlay kustomization
      shell: bash
      env:
        TOKEN: ${{ steps.app-token.outputs.token }}
        APP: ${{ inputs.app }}
        TAG: ${{ inputs.tag }}
        OVERLAY: ${{ inputs.overlay }}
        REPO: ${{ inputs.deploy-repo }}
        DRY_RUN: ${{ inputs.dry-run }}
      run: |
        echo "::group::Clone deploy repo"
        REPO_URL="https://x-access-token:${TOKEN}@github.com/${REPO}.git"
        git clone "${REPO_URL}" deploy-repo
        cd deploy-repo
        echo "::endgroup::"

        OVERLAY_FILE="${APP}/overlays/${OVERLAY}/kustomization.yaml"

        echo "::group::Debug info"
        echo "APP: ${APP}"
        echo "TAG: ${TAG}"
        echo "OVERLAY: ${OVERLAY}"
        echo "FILE: ${OVERLAY_FILE}"
        echo "::endgroup::"

        if [ ! -f "${OVERLAY_FILE}" ]; then
          echo "::error::File not found: ${OVERLAY_FILE}"
          exit 1
        fi

        echo "::group::Before"
        cat "${OVERLAY_FILE}"
        echo "::endgroup::"

        sed -i "s/newTag: .*/newTag: ${TAG}/" "${OVERLAY_FILE}"

        echo "::group::After"
        cat "${OVERLAY_FILE}"
        echo "::endgroup::"

        echo "::group::Diff"
        git diff
        echo "::endgroup::"

        if [ "${DRY_RUN}" = "true" ]; then
          echo "DRY-RUN: would commit to ${REPO}"
          exit 0
        fi

        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add .

        if git diff --cached --quiet; then
          echo "::warning::No changes to commit — tag may already be ${TAG}"
        else
          git commit -m "chore(${APP}): promote ${TAG} to ${OVERLAY}"
          git push
          echo "Promoted ${APP}:${TAG} to ${OVERLAY} overlay"
        fi
