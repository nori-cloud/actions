name: Detect Changes
description: Filter a JSON app list to entries changed between two refs

inputs:
  app-list:
    description: JSON array of app objects with app, dockerfile, and paths
    required: false
    default: ''
  app-list-file:
    description: Path to a JSON app list (use instead of app-list)
    required: false
    default: ''
  include-root-changes:
    description: Select all apps for root-file or .github changes
    required: false
    default: 'false'
  delivery-workflow:
    description: Workflow filename whose last successful push is the comparison base
    required: false
    default: ''
  delivery-branch:
    description: Branch used for delivery history and outdated-ref checks
    required: false
    default: main
  token:
    description: GitHub token with actions read permission (required for delivery-workflow)
    required: false
  base:
    description: Base ref for git diff (for example HEAD^1)
    required: false
    default: ""
  ref:
    description: Head ref for git diff
    required: false
    default: HEAD

outputs:
  apps:
    description: Full JSON array of app configs
    value: ${{ steps.detect.outputs.apps }}
  changed_apps:
    description: Filtered JSON array of changed apps
    value: ${{ steps.detect.outputs.changed_apps }}
  has-changes:
    description: Whether any apps have changes
    value: ${{ steps.detect.outputs.has-changes }}

runs:
  using: composite
  steps:
    - id: detect
      shell: bash
      env:
        APP_LIST: ${{ inputs.app-list }}
        APP_LIST_FILE: ${{ inputs.app-list-file }}
        INCLUDE_ROOT_CHANGES: ${{ inputs.include-root-changes }}
        DELIVERY_WORKFLOW: ${{ inputs.delivery-workflow }}
        DELIVERY_BRANCH: ${{ inputs.delivery-branch }}
        GH_TOKEN: ${{ inputs.token }}
        BASE: ${{ inputs.base }}
        REF: ${{ inputs.ref }}
      run: bash "$GITHUB_ACTION_PATH/detect.sh"
